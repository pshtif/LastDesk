[package]
name = "lastdesk-lastterminal"
version = "0.1.0"
edition = "2021"
description = "LastDesk plugin: LastTerminal's running sessions in the bar"
license = "MIT"
authors = ["Peter @sHTiF Stefcek"]

[[bin]]
name = "lastterminal-plugin"
path = "src/main.rs"

[dependencies]
serde_json = "1"
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
