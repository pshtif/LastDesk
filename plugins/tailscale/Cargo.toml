[package]
name = "lastdesk-tailscale"
version = "0.1.0"
edition = "2021"
description = "LastDesk plugin: Tailscale status, connect / disconnect and exit nodes in the bar"
license = "MIT"
authors = ["Peter @sHTiF Stefcek"]

[[bin]]
name = "tailscale-plugin"
path = "src/main.rs"

[dependencies]
serde_json = "1"
windows = { version = "=0.58.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
